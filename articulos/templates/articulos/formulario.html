{% extends "base.html" %}
{% block titulo %}{{ accion }}{% endblock %}
{% block contenido %}
  <h1>{{ accion }}</h1>
  <form method="post" enctype="multipart/form-data" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Guardar</button>
    <a href="{% url 'listado' %}">Cancelar</a>
  </form>
{% endblock %}
