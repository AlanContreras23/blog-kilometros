{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
  <h1>Crear cuenta</h1>
  <form method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Registrarme</button>
  </form>
  <p>¿Ya tenés cuenta? <a href="{% url 'login' %}">Entrá</a></p>
{% endblock %}
