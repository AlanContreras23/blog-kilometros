{% extends "base.html" %}
{% block titulo %}Editar perfil{% endblock %}
{% block contenido %}
  <h1>Editar perfil</h1>
  <form method="post" enctype="multipart/form-data" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Guardar</button>
    <a href="{% url 'perfil' %}">Cancelar</a>
  </form>
{% endblock %}
